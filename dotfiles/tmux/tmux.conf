# Source for all of this: https://ianthehenry.com/posts/how-to-configure-tmux/

# unbind all ()
unbind -a -T prefix
unbind -a -T root

# unbind -a -T copy-mode
unbind -a -T copy-mode-vi
set -g prefix M-w # set M-w to prefix

# for nicer iterating
bind M-r source-file ~/.tmux.conf \; display-message "  Config reloaded..".

set -g mode-keys vi # so we're using copy-mode-vi (as well as other details)

# status is annoying
set-option -g status off

# bash is annoying
set-option -g default-shell /bin/zsh



# Either M-w SPC or C-SPC enter copy-mode, which is to be interpreted as "pause"
#   because it pauses the terminal (buffering the rest of the output)
#   This by itself is enough reason to use tmux, i think
#   in this "pause", we also happen to be able to select and stuff (is the mental model i'm going for)
bind Space copy-mode
bind -T root C-Space copy-mode

bind -T copy-mode-vi Escape send -X cancel

set -g escape-time 1 # escape character shenanigans? Probably not needed
set set-clipboard external
set -g history-limit 50000
set-option -g allow-rename off # don't rename windows automatically (use , for manually)

# vim motions in copy-mode (and being able to exit it)
bind -T copy-mode-vi v      send -X rectangle-off \; send -X begin-selection
bind -T copy-mode-vi Escape if -F "#{selection_present}" "send -X clear-selection" "send -X cancel"
bind -T copy-mode-vi k      send -X cursor-up
bind -T copy-mode-vi j      send -X cursor-down
bind -T copy-mode-vi h      send -X cursor-left
bind -T copy-mode-vi l      send -X cursor-right
bind -T copy-mode-vi y      send -X copy-selection-no-clear
bind -T copy-mode-vi Enter  send -X copy-selection-and-cancel

set -g mouse on
bind -T root WheelUpPane copy-mode -e # enter copy-mode when scrolling
bind -T copy-mode-vi    WheelUpPane               select-pane \; send-keys -X -N 5 scroll-up
bind -T copy-mode-vi    WheelDownPane             select-pane \; send-keys -X -N 5 scroll-down

bind -T root MouseDrag1Pane copy-mode -M # same as above but for mouse selection
bind -T copy-mode-vi MouseDrag1Pane    send -X begin-selection
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear
bind -T copy-mode-vi MouseDown1Pane  if -F "#{selection_present}" "send -X clear-selection" ""

# switch panes using Alt-arrow without prefix
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Now, stuff i got from `tmux -f /dev/null` list-keys
bind-key    -T prefix          ?                         list-keys -N
bind-key    -T prefix          /                         command-prompt -k -p key { list-keys -1N "%%" }
bind-key    -T copy-mode-vi    n                         send-keys -X search-again
bind-key    -T copy-mode-vi    N                         send-keys -X search-reverse
bind-key    -T copy-mode-vi    q                         send-keys -X cancel
bind-key    -T prefix       :                            command-prompt
# bind-key    -T prefix       ,                            command-prompt -I "#W" { rename-window "%%" }
bind-key    -T copy-mode-vi    Home                      send-keys -X start-of-line
bind-key    -T copy-mode-vi    End                       send-keys -X end-of-line
bind-key    -T copy-mode-vi    NPage                     send-keys -X page-down
bind-key    -T copy-mode-vi    PPage                     send-keys -X page-up
bind-key    -T copy-mode-vi    <                         send-keys -X history-top
bind-key    -T copy-mode-vi    >                         send-keys -X history-bottom
bind-key    -T copy-mode-vi    b                         send-keys -X previous-word
bind-key    -T copy-mode-vi    B                         send-keys -X previous-space
bind-key    -T copy-mode-vi    e                         send-keys -X next-word-end
bind-key    -T copy-mode-vi    E                         send-keys -X next-space-end
bind-key    -T copy-mode-vi    f                         command-prompt -1 -p "(jump forward)" { send-keys -X jump-forward -- "%%" }
bind-key    -T copy-mode-vi    "{"                       send-keys -X previous-paragraph
bind-key    -T copy-mode-vi    "}"                       send-keys -X next-paragraph
bind-key    -T copy-mode-vi    M-Up                      send-keys -X halfpage-up
bind-key    -T copy-mode-vi    M-Down                    send-keys -X halfpage-down
bind-key    -T copy-mode-vi    0                         send-keys -X start-of-line
bind-key    -T copy-mode-vi    _                         send-keys -X back-to-indentation
bind-key    -T copy-mode-vi    "\$"                      send-keys -X end-of-line
bind-key    -T copy-mode-vi    C-g                       send-keys -X clear-selection
bind-key    -T copy-mode-vi    C-c                       send-keys -X cancel
bind-key    -T copy-mode-vi    q                         send-keys -X cancel
bind-key    -T copy-mode-vi    C-n                       send-keys -X cursor-down
bind-key    -T copy-mode-vi    C-p                       send-keys -X cursor-up
bind-key    -T copy-mode-vi \%                        send-keys -X next-matching-bracket
bind-key    -T copy-mode-vi /                         command-prompt -T search -p "(search down)" { send-keys -X search-forward -- "%%" }
bind-key    -T copy-mode-vi :                         command-prompt -p "(goto line)" { send-keys -X goto-line -- "%%" }
bind-key    -T copy-mode-vi G                         send-keys -X history-bottom
bind-key    -T copy-mode-vi H                         send-keys -X top-line
bind-key    -T copy-mode-vi J                         send-keys -X scroll-down
bind-key    -T copy-mode-vi C-y                       send-keys -X scroll-up
bind-key    -T copy-mode-vi K                         send-keys -X scroll-up
bind-key    -T copy-mode-vi C-e                       send-keys -X scroll-down
bind-key    -T copy-mode-vi L                         send-keys -X bottom-line
bind-key    -T copy-mode-vi W                         send-keys -X next-space
bind-key    -T copy-mode-vi V                         send-keys -X rectangle-on \; send -X begin-selection 
bind-key    -T copy-mode-vi C-d                       send-keys -X halfpage-down
bind-key    -T copy-mode-vi C-u                       send-keys -X halfpage-up
bind-key    -T prefix       \#                        list-buffers # doesn't do anything? wack
bind-key    -T prefix       d                         detach-client
bind-key    -T prefix       q                         display-panes
bind-key    -T prefix       w                         choose-tree -Zw
bind-key    -T prefix       z                         resize-pane -Z # use again to undo
bind-key    -T prefix       \{                        swap-pane -U
bind-key    -T prefix       \}                        swap-pane -D
bind-key    -T prefix       C-z                       suspend-client

# M-vim for motion, M-arrow for resizing!
bind-key -r -T root       M-Up                      resize-pane -U 5
bind-key -r -T root       M-Down                    resize-pane -D 5
bind-key -r -T root       M-Left                    resize-pane -L 5
bind-key -r -T root       M-Right                   resize-pane -R 5

bind-key    -T prefix       M-1                       select-layout even-horizontal
bind-key    -T prefix       M-2                       select-layout even-vertical
bind-key    -T prefix       M-3                       select-layout main-horizontal
bind-key    -T prefix       M-4                       select-layout main-vertical
bind-key    -T prefix       M-5                       select-layout tiled
bind-key    -T prefix       M-6                       select-layout main-horizontal-mirrored
bind-key    -T prefix       M-7                       select-layout main-vertical-mirrored
# todo: add 'gg' to go back to previous prompt

unbind '"'
unbind  %
bind  %  split-window -v
bind '"' split-window -h
bind  k  confirm-before -p "kill-pane #P? (y/n)" kill-pane

 
